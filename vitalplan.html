<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:28px;line-height:1.5;color:#0f172a;background:#f1f5f9;min-height:100vh;min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:absolute;top:-100px;left:0;background:#1e40af;color:#fff;padding:12px 20px;font-weight:700;z-index:9999;border-radius:0 0 12px 0;text-decoration:none;font-size:18px}
.skip-link:focus{top:0;outline:4px solid #fcd34d;outline-offset:2px}
*:focus{outline:none}
*:focus-visible{outline:4px solid #1e40af;outline-offset:3px;border-radius:4px}
.btn.success:focus-visible{outline-color:#065f46}
.btn.danger:focus-visible{outline-color:#7f1d1d}
body.high-contrast{background:#fff;color:#000}
body.high-contrast .card,body.high-contrast #app{background:#fff;border-color:#000}
body.high-contrast .btn{border:2px solid #000}
body.high-contrast .btn.secondary{background:#fff;color:#000;border:3px solid #000}
body.high-contrast .choice{border-width:3px;border-color:#000}
body.high-contrast .choice.active{background:#000;color:#fff;border-color:#000}
body.high-contrast .gate-stop{background:#fff;color:#000;border:4px solid #dc2626}
body.high-contrast .gate-warn{background:#fff;color:#000;border:4px solid #d97706}
body.high-contrast .gate-ok{background:#fff;color:#000;border:4px solid #059669}
body.high-contrast *:focus-visible{outline-color:#d97706;outline-width:5px}
body.high-contrast .text-muted,body.high-contrast .scale-label,body.high-contrast .progress-label,body.high-contrast .timer-label,body.high-contrast .session-info .s-meta,body.high-contrast .stat-box .stat-lbl,body.high-contrast .stat-box .stat-sub,body.high-contrast .choice .choice-sub,body.high-contrast .nav-item,body.high-contrast .reps-total,body.high-contrast .bench-unit,body.high-contrast .chart-sub,body.high-contrast .modal-close,body.high-contrast .workout-close{color:#000}
body.large-text{font-size:34px}
body.large-text .btn{font-size:34px;min-height:128px}
body.large-text .btn.big{font-size:38px;min-height:140px}
body.large-text .view h1,body.large-text .ex-name{font-size:56px}
body.large-text .view h2{font-size:42px}
body.large-text .ex-cue{font-size:38px}
body.large-text .field input,body.large-text .field textarea{font-size:32px;min-height:96px}
body.large-text .choice{font-size:30px;min-height:120px}
body.large-text .card h2{font-size:32px}
body.large-text .guide-section h3{font-size:32px}
body.large-text .btn-row .btn{min-height:110px;font-size:26px}
body.large-text .scale button{min-height:96px;font-size:28px}
#app{max-width:800px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#f8fafc;position:relative;padding-bottom:calc(110px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
.view{padding:20px 18px}
.view h1{font-size:46px;font-weight:900;margin-bottom:6px;letter-spacing:-.02em}
.view .subtitle{color:#334155;margin-bottom:20px;font-size:20px}
.view h2{font-size:38px;font-weight:800;margin-bottom:12px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid #e2e8f0}
.card h2{font-size:28px;font-weight:800;margin-bottom:12px}
.card h3{font-size:22px;font-weight:700;margin-bottom:10px;color:#334155}
.card p{margin-bottom:6px}.card p:last-child{margin-bottom:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:110px;padding:20px;border-radius:20px;font-size:32px;font-weight:800;background:#1e40af;color:#fff;border:4px solid #162d7a;box-shadow:0 6px 0px #162d7a;transition:transform .06s,box-shadow .06s;touch-action:manipulation;margin-bottom:14px}
.btn:last-child{margin-bottom:0}
.btn:active{transform:translateY(6px);box-shadow:0 0px 0px #162d7a;background:#1e3a8a}
.btn:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.btn.big{min-height:120px;font-size:36px;border-radius:24px}
.btn.secondary{background:#e2e8f0;color:#0f172a;border-color:#c0c9d6;box-shadow:0 6px 0px #b0b8c4}
.btn.secondary:active{background:#cbd5e1;transform:translateY(6px);box-shadow:0 0px 0px #b0b8c4}
.btn.success{background:#059669;border-color:#047857;box-shadow:0 6px 0px #047857}.btn.success:active{background:#047857;transform:translateY(6px);box-shadow:0 0px 0px #047857}
.btn.warn{background:#d97706;border-color:#b45309;box-shadow:0 6px 0px #b45309}
.btn.danger{background:#dc2626;border-color:#b91c1c;box-shadow:0 6px 0px #b91c1c}.btn.danger:active{background:#b91c1c;transform:translateY(6px);box-shadow:0 0px 0px #b91c1c}
.btn.ghost{background:transparent;color:#1e40af;border:3px solid #1e40af;box-shadow:none}
.btn.ghost:active{transform:scale(.97);box-shadow:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-row .btn{margin-bottom:0;min-height:96px;font-size:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:17px;font-weight:600;margin-bottom:8px;color:#334155}
.field input[type=number],.field input[type=text],.field textarea{width:100%;min-height:80px;padding:18px 20px;border-radius:16px;border:3px solid #cbd5e1;background:#fff;font-size:26px;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus{border-color:#1e40af}
.field textarea{min-height:88px;resize:vertical}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.scale-10{grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{min-height:84px;border-radius:14px;background:#e2e8f0;font-weight:800;font-size:26px;color:#334155;border:3px solid #cbd5e1;box-shadow:0 4px 0px #b0b8c4}
.scale button.active{background:#1e40af;color:#fff;transform:scale(1.05);border-color:#162d7a;box-shadow:0 4px 0px #162d7a}
.scale-label{display:flex;justify-content:space-between;font-size:14px;color:#475569;margin-top:6px}
.choice{width:100%;text-align:left;padding:22px;border-radius:20px;border:4px solid #e2e8f0;background:#fff;margin-bottom:12px;font-weight:700;font-size:28px;display:flex;align-items:center;gap:16px;min-height:110px;box-shadow:0 4px 0px #d1d5db}
.choice.active{border-color:#1e40af;background:#eff6ff;box-shadow:0 4px 0px #1e40af}.choice.active::before{content:'✓';position:absolute;top:10px;right:14px;font-size:28px;font-weight:900;color:#1e40af}.choice{position:relative}
.choice .choice-icon{font-size:32px;flex-shrink:0}
.choice .choice-text{flex:1}
.choice .choice-sub{font-size:14px;color:#475569;font-weight:500;margin-top:2px;line-height:1.35}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:800px;background:#fff;border-top:2px solid #e2e8f0;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px;padding:8px;color:#475569;font-size:16px;font-weight:700}
.nav-item .nav-icon{font-size:30px;margin-bottom:4px}
.nav-item.active{color:#1e40af}
.gate{padding:22px;border-radius:18px;margin-bottom:18px;font-size:22px;line-height:1.5}
.gate-ok{background:#d1fae5;color:#065f46;border:3px solid #a7f3d0}
.gate-warn{background:#fef3c7;color:#92400e;border:3px solid #fde68a}
.gate-stop{background:#fee2e2;color:#991b1b;border:3px solid #fecaca}
.gate strong{display:block;font-size:24px;margin-bottom:6px}
.workout{min-height:calc(100vh - 88px);min-height:calc(100dvh - 88px);display:flex;flex-direction:column;justify-content:space-between;padding:16px 16px;background:linear-gradient(180deg,#eff6ff 0%,#f8fafc 40%);overflow:hidden}
.workout-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.progress-label{font-size:18px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.workout-close{font-size:32px;color:#475569;padding:10px 16px;min-width:60px;min-height:60px;border-radius:14px}
.workout-close:active{background:#e2e8f0}
.ex-name{font-size:46px;font-weight:900;line-height:1.15;margin-bottom:10px;letter-spacing:-.02em}
.ex-illus{font-size:160px;text-align:center;margin:20px 0;line-height:1}
.ex-cue{font-size:32px;font-weight:800;text-align:center;color:#1e40af;margin-bottom:16px;line-height:1.3}
.ex-safety{background:#fef3c7;color:#78350f;border-radius:16px;padding:18px 20px;font-size:22px;margin-bottom:20px;line-height:1.45;border:2px solid #fde68a}
.timer-huge{font-size:180px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:#0f172a;line-height:1;margin:14px 0}
.timer-huge.alert{color:#d97706}
.timer-label{text-align:center;font-size:20px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.reps-display{display:flex;justify-content:center;align-items:baseline;gap:10px;margin:20px 0}
.reps-big{font-size:110px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.reps-total{font-size:40px;color:#475569;font-weight:700}
.set-dots{display:flex;justify-content:center;gap:10px;margin:14px 0}
.set-dot{width:14px;height:14px;border-radius:50%;background:#cbd5e1}
.set-dot.done{background:#059669}
.set-dot.current{background:#1e40af;transform:scale(1.3)}
.workout-progress{height:10px;background:#e2e8f0;border-radius:5px;margin-bottom:16px;overflow:hidden}
.workout-progress-fill{height:100%;background:#059669;border-radius:5px;transition:width .3s ease}
.rep-indicator{text-align:center;font-size:28px;font-weight:800;color:#1e40af;margin:8px 0}
.confirm-box{text-align:center;padding:30px 10px}
.confirm-box .confirm-icon{font-size:80px;margin-bottom:12px}
.confirm-box .confirm-msg{font-size:34px;font-weight:800;color:#059669;margin-bottom:20px}
.feedback-box{text-align:center;padding:20px 10px}
.feedback-box .feedback-icon{font-size:80px;margin-bottom:10px}
.feedback-box .feedback-title{font-size:38px;font-weight:900;color:#059669;margin-bottom:10px}
.feedback-box .feedback-summary{font-size:28px;color:#334155;margin-bottom:18px;line-height:1.4;font-weight:700}
.feedback-emojis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.feedback-emojis button{min-height:120px;border-radius:18px;font-size:28px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:4px solid #e2e8f0;background:#fff;color:#334155;box-shadow:0 4px 0px #d1d5db;transition:transform .06s}
.feedback-emojis button .fb-emoji{font-size:56px}
.feedback-emojis button.fb-easy{border-color:#a7f3d0;background:#ecfdf5;color:#065f46}
.feedback-emojis button.fb-easy.active{background:#059669;color:#fff;border-color:#047857;box-shadow:0 4px 0px #047857;transform:scale(1.05)}
.feedback-emojis button.fb-ok{border-color:#bfdbfe;background:#eff6ff;color:#1e40af}
.feedback-emojis button.fb-ok.active{background:#1e40af;color:#fff;border-color:#162d7a;box-shadow:0 4px 0px #162d7a;transform:scale(1.05)}
.feedback-emojis button.fb-hard{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.feedback-emojis button.fb-hard.active{background:#dc2626;color:#fff;border-color:#b91c1c;box-shadow:0 4px 0px #b91c1c;transform:scale(1.05)}
.btn.pause{background:#d97706;border-color:#b45309;box-shadow:0 6px 0px #b45309}
.btn.pause:active{background:#b45309;transform:translateY(6px);box-shadow:0 0px 0px #b45309}
.workout-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:10px}
.workout .ex-illus{font-size:80px;margin:8px 0}
.workout .ex-name{font-size:36px;margin-bottom:6px}
.workout .ex-cue{font-size:24px;margin-bottom:10px}
.workout .ex-safety{font-size:18px;padding:12px 14px;margin-bottom:10px}
.workout .timer-huge{font-size:120px;margin:8px 0}
@media (min-height:900px){
.workout .ex-illus{font-size:120px;margin:14px 0}
.workout .timer-huge{font-size:160px;margin:12px 0}
.workout .ex-name{font-size:42px}
}
.prog-card{background:linear-gradient(135deg,#1e40af 0%,#3b82f6 100%);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.prog-card h2{color:#fff;margin-bottom:8px}
.prog-card p{font-size:16px;opacity:.95;margin-bottom:12px;line-height:1.45}
.prog-card .btn{background:#fff;color:#1e40af}
.deload-card{background:linear-gradient(135deg,#b45309 0%,#f59e0b 100%);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.deload-card h2{color:#fff;margin-bottom:8px}
.deload-card p{opacity:.95;margin-bottom:12px}
.session-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:#fff;border:1px solid #e2e8f0;margin-bottom:10px;width:100%;text-align:left;min-height:80px}
.session-date{min-width:62px;text-align:center;padding:8px 4px;border-radius:10px;background:#eff6ff;color:#1e40af}
.session-date .dd{font-size:22px;font-weight:800;line-height:1}
.session-date .mm{font-size:11px;font-weight:600;text-transform:uppercase}
.session-info{flex:1;font-size:15px;min-width:0}
.session-info .s-title{font-weight:700;font-size:16px;color:#0f172a}
.session-info .s-meta{color:#475569;font-size:13px;margin-top:2px;line-height:1.4}
.session-badge{padding:4px 10px;border-radius:10px;font-size:12px;font-weight:700;text-transform:uppercase;flex-shrink:0}
.b-ok{background:#d1fae5;color:#065f46}
.b-warn{background:#fef3c7;color:#92400e}
.b-bench{background:#e0e7ff;color:#3730a3}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;text-align:center}
.stat-box .stat-num{font-size:30px;font-weight:800;color:#1e40af;line-height:1}
.stat-box .stat-lbl{font-size:13px;color:#475569;font-weight:600;margin-top:4px}
.stat-box .stat-sub{font-size:12px;color:#64748b;margin-top:2px}
.evidence-note{font-size:13px;color:#475569;background:#f1f5f9;padding:10px 12px;border-radius:10px;line-height:1.45;margin-top:10px;border-left:3px solid #1e40af}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:800px;background:#fff;border-radius:24px 24px 0 0;padding:28px 24px calc(28px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:28px;margin-bottom:14px}
.modal-close{float:right;font-size:28px;padding:0 8px;color:#475569;min-width:44px;min-height:44px}
.chart-wrap{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px}
.chart-title{font-size:14px;font-weight:700;color:#334155;margin-bottom:4px}
.chart-sub{font-size:12px;color:#475569;margin-bottom:10px}
.chart-empty{text-align:center;color:#64748b;padding:30px 0;font-size:14px}
.bench-card{background:#fff;border:2px solid #c7d2fe;border-radius:16px;padding:18px;margin-bottom:12px}
.bench-card h3{color:#3730a3;margin-bottom:6px}
.bench-result{display:flex;align-items:baseline;gap:8px;margin:10px 0;flex-wrap:wrap}
.bench-num{font-size:36px;font-weight:800;color:#1e40af}
.bench-unit{font-size:16px;color:#475569;font-weight:600}
.bench-trend{font-size:14px;font-weight:600;margin-left:auto}
.trend-up{color:#059669}.trend-down{color:#dc2626}.trend-flat{color:#475569}
.guide-section{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:14px}
.guide-section h3{font-size:24px;margin-bottom:10px;color:#1e40af}
.guide-section p{margin-bottom:10px;line-height:1.55}
.guide-section ul{margin:8px 0 12px 24px}
.guide-section li{margin-bottom:6px;line-height:1.5}
.spacer{height:12px}
.divider{border-top:1px solid #e2e8f0;margin:16px 0}
.text-muted{color:#475569;font-size:20px}
.text-center{text-align:center}
.pill{display:inline-block;padding:4px 10px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;font-weight:600;margin-right:6px;margin-bottom:4px}
.pill-warn{background:#fef3c7;color:#92400e}
.baseline-tag{display:inline-block;padding:2px 8px;border-radius:8px;background:#ddd6fe;color:#5b21b6;font-size:11px;font-weight:700;text-transform:uppercase;margin-left:6px}
.a11y-fab{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:150;width:52px;height:52px;border-radius:26px;background:#1e40af;color:#fff;font-size:22px;box-shadow:0 2px 8px rgba(30,64,175,.4);display:flex;align-items:center;justify-content:center}
.a11y-fab:active{background:#1e3a8a}
.a11y-fab.fab-speaking{animation:fabPulseYellow 1.2s infinite}
.a11y-fab.fab-listening{background:#dc2626;animation:fabPulseRed 1s infinite}
@keyframes fabPulseYellow{0%,100%{box-shadow:0 0 8px rgba(250,204,21,.4)}50%{box-shadow:0 0 20px rgba(250,204,21,.8)}}
@keyframes fabPulseRed{0%,100%{box-shadow:0 0 8px rgba(220,38,38,.4)}50%{box-shadow:0 0 20px rgba(220,38,38,.9)}}
.speaking-dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:#facc15;animation:dotBlink 1s infinite;margin-right:10px;flex-shrink:0}
.listening-dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:#dc2626;animation:dotBlink .7s infinite;margin-right:10px;flex-shrink:0}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.25}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:0 auto}
.numpad-btn{min-height:100px;border-radius:18px;background:#e2e8f0;font-size:52px;font-weight:900;color:#0f172a;border:3px solid #cbd5e1;box-shadow:0 5px 0px #b0b8c4;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}
.numpad-btn:active{background:#cbd5e1;transform:translateY(5px);box-shadow:0 0px 0px #b0b8c4}
.numpad-ok{background:#059669;color:#fff;border-color:#047857;box-shadow:0 5px 0px #047857}
.numpad-ok:active{background:#047857;transform:translateY(5px);box-shadow:0 0px 0px #047857}
.numpad-clear{background:#f1f5f9;color:#475569;font-size:28px}
.numpad-display{font-size:72px;font-weight:900;text-align:center;color:#1e40af;padding:18px;border:4px solid #1e40af;border-radius:20px;background:#fff;margin-bottom:14px;min-height:110px;display:flex;align-items:center;justify-content:center;letter-spacing:.05em}

const CITATIONS={

};
function fmtCitation(key){const c=CITATIONS[key];if(!c)return key;return`${c.authors.split(',')[0]} et al. ${c.year}, ${c.journal}`;}
function fmtCitationFull(key){const c=CITATIONS[key];if(!c)return key;return`${c.authors} (${c.year}). ${c.title}. ${c.journal}, ${c.vol}, ${c.pages}.`;}

/* ===== EVIDENCE ===== */
const EVIDENCE={

t2d:{short:"Typ-2-Diabetes · Training ≥ 8 Wo.",detail:"6-MWT +51,6 m · 30-Sek-Chair-Stand +4,66 Wdh. · Leg-Press 1RM +18 kg · VO₂max +2,41 ml/kg/min.",citationKeys:['colberg2016']},

/* ===== EXERCISE LIBRARY ===== */
const EX={
march:{id:'march',cat:'warmup',name:'Marschieren am Platz',type:'time',baseSec:120,illus:'🚶',illusAlt:'Person marschiert',citations:['mak2017','shu2014'],variants:{
standing:{hy:['none','I','II'],cue:'Knie heben · Arme schwingen · aufrecht bleiben',safety:'Stellen Sie sich neben eine Wand oder einen Stuhl zum Festhalten. Tragen Sie feste Schuhe mit rutschfester Sohle. Bei Schwindel sofort stoppen und festhalten.',voice:'Marschieren Sie am Platz.',audioDesc:'Marschieren im Stehen. Stellen Sie sich aufrecht hin, Blick geradeaus, Schultern entspannt nach hinten und unten. Heben Sie abwechselnd das linke und rechte Knie so hoch, wie es bequem geht, mindestens bis auf Hüfthöhe. Schwingen Sie die Arme gegenläufig locker mit: linkes Knie hoch, rechter Arm nach vorn. Tempo: etwa ein Schritt pro Sekunde, also ruhig und gleichmäßig. Atmen Sie frei weiter, nicht die Luft anhalten. Falls Sie unsicher werden, greifen Sie kurz zur Wand.',
coaching:['Schönes Tempo. Knie bewusst heben, nicht schlurfen.','Arme locker mitschwingen. Schultern bleiben unten.','Aufrecht bleiben. Blick geradeaus, nicht auf die Füße.','Atmen nicht vergessen. Ruhig ein und aus.','Letzte Phase. Tempo halten, Sie schaffen das.']},
seated:{hy:['III'],cue:'Knie abwechselnd hoch · Rücken aufrecht',safety:'Stabiler Stuhl mit Armlehnen. Rücken bleibt an der Lehne. Füße starten flach am Boden. Bei Schwindel Armlehnen greifen.',voice:'Marschieren im Sitzen.',audioDesc:'Setzen Sie sich aufrecht auf einen stabilen Stuhl mit Armlehnen. Rücken an die Lehne, Füße flach am Boden. Heben Sie abwechselnd das linke und das rechte Knie so hoch wie bequem möglich. Stellen Sie sich vor, Sie marschieren im Sitzen. Tempo: ein Knie pro Sekunde, also ruhig. Arme dürfen auf den Lehnen liegen oder leicht mitschwingen. Atmen Sie gleichmäßig weiter.',
coaching:['Knie bewusst heben. Oberschenkel hebt sich vom Stuhl.','Rücken bleibt an der Lehne. Nicht nach vorn kippen.','Gleichmäßig atmen. Ein Knie pro Sekunde.','Sehr gut. Weiter so, ruhiges Tempo.','Letzte Phase. Sie sind fast fertig.']}}},
big_arms:{id:'big_arms',cat:'warmup',name:'Große Armkreise',type:'reps',baseReps:6,baseSets:1,secsPerRep:3,illus:'🙆',illusAlt:'Arme kreisen',citations:['mak2017','shu2014'],variants:{
standing:{hy:['none','I','II'],cue:'Arme gestreckt · große Kreise nach hinten · Schultern entspannt',safety:'Stehen Sie aufrecht, Füße hüftbreit. Schultern nicht hochziehen. Bei Schmerz in der Schulter kleinere Kreise machen oder stoppen. Mindestens eine Armlänge Abstand zu Möbeln.',voice:'Große Armkreise nach hinten.',audioDesc:'Stehen Sie aufrecht, Füße hüftbreit auseinander. Strecken Sie beide Arme seitlich aus auf Schulterhöhe. Kreisen Sie beide Arme gleichzeitig in großen Bögen nach hinten. Stellen Sie sich vor, Sie zeichnen mit den Fingerspitzen große Kreise an die Wand. So groß wie schmerzfrei möglich. Tempo: langsam und kontrolliert, etwa drei Sekunden pro Kreis. Schultern bleiben entspannt unten, nicht hochziehen. Atmen Sie ruhig weiter. Nach fünf Kreisen können Sie die Richtung wechseln und nach vorne kreisen.'},
seated:{hy:['III'],cue:'Im Sitzen · Arme groß kreisen · Rücken aufrecht',safety:'Stuhl mit Rückenlehne. Rücken bleibt an Lehne. Bei Schultersteife nur so weit, wie schmerzfrei möglich.',voice:'Armkreise im Sitzen.',audioDesc:'Setzen Sie sich aufrecht hin, Rücken an die Lehne. Strecken Sie beide Arme seitlich aus. Kreisen Sie langsam in großen Bögen nach hinten. Nur so weit kreisen, wie es schmerzfrei geht. Fünf Kreise rückwärts, dann fünf vorwärts. Schultern bewusst locker lassen.'}}},
weight_shift:{id:'weight_shift',cat:'warmup',name:'Gewicht verlagern',type:'time',baseSec:45,illus:'⚖️',illusAlt:'Gewichtsverlagerung',citations:['mak2017','shu2014'],variants:{
standing:{hy:['none','I'],cue:'Gewicht links · Mitte · rechts · langsam pendeln',safety:'Stellen Sie sich neben eine Wand oder einen Stuhl. Füße bleiben am Boden, nicht anheben. Bei Schwindel sofort festhalten.',voice:'Gewicht langsam verlagern.',audioDesc:'Stellen Sie sich aufrecht hin, Füße etwas weiter als hüftbreit. Wand oder Stuhl in Griffweite. Verlagern Sie Ihr Gewicht langsam nach links, bis Sie das linke Bein deutlich mehr belasten. Kurz halten. Dann langsam zurück zur Mitte und weiter nach rechts. Pendeln Sie so hin und her wie ein langsames Metronom. Tempo: etwa drei Sekunden pro Seite. Oberkörper bleibt aufrecht, nicht zur Seite kippen. Die Füße bleiben fest am Boden.',
coaching:['Langsam nach links, spüren Sie das Gewicht im linken Fuß.','Zurück zur Mitte und nach rechts. Ruhig pendeln.','Oberkörper aufrecht. Nicht zur Seite lehnen.','Schön gleichmäßig. Spüren Sie das Gleichgewicht.','Letzte Sekunden. Ruhig auspendeln.']},
supported:{hy:['II','III'],cue:'Hand am Halt · Gewicht links und rechts · langsam',safety:'Eine Hand fest an Wand oder Stuhllehne. Andere Hand darf auch greifen wenn nötig. Langsam bewegen.',voice:'Gewicht verlagern mit Halt.',audioDesc:'Stellen Sie sich seitlich zur Wand oder zum Stuhl. Eine Hand hält sich fest. Füße etwas weiter als hüftbreit. Verlagern Sie Ihr Gewicht langsam nach links, kurz halten, dann nach rechts. Drei Sekunden pro Seite. Oberkörper bleibt gerade. Die Stützhand gibt Sicherheit, versuchen Sie aber, möglichst wenig Druck darauf zu geben.',
coaching:['Gewicht nach links. Hand gibt nur Sicherheit.','Zurück und nach rechts. Langsam und kontrolliert.','Versuchen Sie, weniger auf die Stützhand zu drücken.','Gleichmäßig atmen. Ruhig pendeln.','Sehr gut. Letzte Sekunden.']}}},
sit_to_stand:{id:'sit_to_stand',cat:'strength',name:'Vom Stuhl aufstehen',type:'reps',baseReps:5,baseSets:2,restSec:45,secsPerRep:7,illus:'🪑',illusAlt:'Aufstehen vom Stuhl',citations:['liu2009'],equipment:['chair'],variants:{
crossed:{hy:['none','I','II'],cue:'Arme verschränkt · Nase über Zehen · langsam hoch · kontrolliert setzen',safety:'Stabiler Stuhl ohne Rollen, am besten an der Wand. Nicht nach vorn fallen. Falls Sie nicht ohne Arme hochkommen: Hände auf die Oberschenkel stützen ist in Ordnung.',voice:'Vom Stuhl aufstehen ohne Arme.',audioDesc:'Setzen Sie sich auf die vordere Hälfte eines stabilen Stuhls ohne Rollen. Verschränken Sie die Arme vor der Brust. Füße hüftbreit, leicht nach hinten unter den Stuhl gezogen. Beugen Sie den Oberkörper nach vorn, bis Ihre Nase über Ihren Zehen ist. Dann drücken Sie sich mit den Beinen langsam nach oben, bis Sie gerade stehen. Kurz stehen bleiben, Gleichgewicht finden. Dann langsam und kontrolliert wieder hinsetzen, nicht plumpsen. Tempo: drei Sekunden hoch, eine Sekunde stehen, drei Sekunden runter.'},
with_arms:{hy:['III'],cue:'Hände auf Armlehnen · nach vorn beugen · langsam drücken',safety:'Stuhl mit stabilen Armlehnen an der Wand. Nicht nach vorn fallen lassen. Bei Schwindel sitzen bleiben.',voice:'Aufstehen mit Armstütze.',audioDesc:'Stabiler Stuhl mit Armlehnen, an der Wand. Setzen Sie sich auf die vordere Hälfte. Hände auf die Armlehnen. Oberkörper nach vorn beugen, dann mit Armen und Beinen gemeinsam hochdrücken. Oben kurz stehen, Gleichgewicht finden. Langsam zurück setzen. Drei Sekunden hoch, drei Sekunden runter.'}}},
calf_raise:{id:'calf_raise',cat:'strength',name:'Wadenheben',type:'reps',baseReps:6,baseSets:2,restSec:30,secsPerRep:6,illus:'🦶',illusAlt:'Fersen heben',citations:['liu2009'],equipment:['wall_or_chair'],variants:{
both:{hy:['none','I','II','III'],cue:'Fersen langsam hoch · 2 Sek. oben halten · kontrolliert senken',safety:'Beide Hände an Wand oder Stuhllehne. Knie nicht durchdrücken. Bei Wadenkrämpfen sofort stoppen und dehnen.',voice:'Wadenheben mit Halt.',audioDesc:'Stellen Sie sich vor eine Wand oder hinter einen Stuhl. Beide Hände halten sich leicht fest. Füße hüftbreit, parallel. Drücken Sie beide Fersen langsam hoch, bis Sie auf den Zehenspitzen stehen. Oben zwei Sekunden halten, spüren Sie die Spannung in den Waden. Dann die Fersen ganz langsam wieder absenken, nicht fallen lassen. Tempo: zwei Sekunden hoch, zwei Sekunden halten, zwei Sekunden runter. Die Knie bleiben leicht gebeugt, nicht durchgedrückt.'}}},
chair_squat:{id:'chair_squat',cat:'strength',name:'Kniebeuge zum Stuhl',type:'reps',baseReps:4,baseSets:2,restSec:45,secsPerRep:7,illus:'🏋️',illusAlt:'Kniebeuge',citations:['liu2009'],equipment:['chair'],variants:{
touch:{hy:['none','I','II'],cue:'Po nach hinten · Stuhl kurz berühren · Knie hinter Zehen',safety:'Stuhl direkt hinter Ihnen an der Wand. Knie zeigen in Richtung der Zehen, nicht nach innen. Oberkörper darf sich leicht nach vorn neigen. Bei Knieschmerz nicht so tief gehen.',voice:'Kniebeuge zum Stuhl.',audioDesc:'Stellen Sie sich vor den Stuhl, Rücken zum Stuhl. Füße hüftbreit. Schieben Sie den Po nach hinten und unten, als wollten Sie sich setzen. Der Stuhl hinter Ihnen ist Ihre Sicherheit. Sobald Ihr Po den Stuhl leicht berührt, drücken Sie sich wieder hoch. Wichtig: Knie bleiben hinter den Zehenspitzen, Gewicht auf den Fersen. Oberkörper neigt sich leicht vor für Balance. Tempo: drei Sekunden runter, kurz tippen, drei Sekunden hoch.'},
skip:{hy:['III'],skip:true}}},
bottle_row:{id:'bottle_row',cat:'posture',name:'Rudern mit Flaschen',type:'reps',baseReps:6,baseSets:2,restSec:30,secsPerRep:5,illus:'💪',illusAlt:'Rudern',citations:['liu2009'],equipment:['weights'],variants:{
standing:{hy:['none','I','II'],cue:'Vorbeugen · Ellbogen nach hinten · Schulterblätter zusammen',safety:'Rücken bleibt gerade, nie rund. Leichte Kniebeugung. Blick zum Boden, Nacken lang. Bei Rückenschmerz aufhören.',voice:'Rudern im Stehen mit Flaschen.',audioDesc:'Nehmen Sie eine Wasserflasche oder Hantel in jede Hand. Stellen Sie sich aufrecht hin, Füße hüftbreit. Beugen Sie den Oberkörper aus der Hüfte nach vorn, etwa 45 Grad. Knie leicht gebeugt. Rücken bleibt gerade wie ein Brett, nicht rund machen. Arme hängen nach unten. Ziehen Sie nun beide Ellbogen gleichzeitig nach hinten oben, als wollten Sie die Schulterblätter zusammendrücken. Oben kurz halten und die Spannung zwischen den Schulterblättern spüren. Dann langsam senken. Tempo: zwei Sekunden ziehen, eine Sekunde halten, zwei Sekunden senken.'},
seated:{hy:['III'],cue:'Sitzend · Ellbogen nach hinten oben · Schulterblätter zusammen',safety:'Stabiler Stuhl. Füße fest am Boden. Rücken aufrecht. Bei Schulterschmerz aufhören.',voice:'Rudern im Sitzen.',audioDesc:'Setzen Sie sich aufrecht hin. Wasserflasche in jeder Hand. Arme hängen seitlich neben dem Stuhl. Ziehen Sie beide Ellbogen gleichzeitig nach hinten oben. Stellen Sie sich vor, Sie wollen die Schulterblätter zusammenkneifen. Oben eine Sekunde halten, dann langsam senken. Oberkörper bleibt aufrecht.'}}},
wall_pushup:{id:'wall_pushup',cat:'posture',name:'Wandliegestütz',type:'reps',baseReps:5,baseSets:2,restSec:30,secsPerRep:5,illus:'🧱',illusAlt:'Wandliegestütz',citations:['liu2009'],equipment:['wall'],variants:{
standard:{hy:['none','I','II','III'],cue:'Armlänge Abstand · Nase zur Wand · Körper gerade wie ein Brett',safety:'Freie Wandfläche ohne Bilder oder Regale. Füße rutschfest am Boden. Handgelenke dürfen nicht schmerzen. Bei Schulterproblemen nur halbe Tiefe.',voice:'Wandliegestütz.',audioDesc:'Stellen Sie sich etwa eine Armlänge von einer freien Wand entfernt auf. Füße hüftbreit. Setzen Sie beide Hände auf Schulterhöhe und Schulterbreite an die Wand, Finger zeigen nach oben. Ihr Körper bildet eine gerade Linie von Kopf bis Fuß, wie ein Brett. Beugen Sie langsam die Arme und lassen Sie die Nase Richtung Wand sinken. Ellbogen zeigen leicht nach außen. Dann drücken Sie sich kontrolliert zurück in die Ausgangsposition. Tempo: zwei Sekunden zur Wand, eine Sekunde halten, zwei Sekunden abdrücken. Wichtig: Hüfte nicht durchhängen lassen und nicht den Po nach hinten strecken.'}}},
half_tandem:{id:'half_tandem',cat:'balance',name:'Halb-Tandem-Stand',type:'time',baseSec:20,baseSets:2,illus:'🧍',illusAlt:'Tandemstand',citations:['mak2017','shu2014'],equipment:['wall_or_chair'],variants:{
free:{hy:['none','I'],cue:'Ein Fuß halb vor den anderen · Ferse auf Mitte · ruhig stehen',safety:'Wand oder Stuhl in Griffweite. Bei Wackeln sofort greifen. Blick geradeaus auf einen festen Punkt.',voice:'Halb-Tandem-Stand.',audioDesc:'Stellen Sie sich aufrecht hin, Wand oder Stuhl in Griffweite. Setzen Sie einen Fuß halb vor den anderen: die Ferse des vorderen Fußes steht etwa auf Höhe der Mitte des hinteren Fußes. Beide Füße zeigen nach vorn. Versuchen Sie, ruhig in dieser Position zu stehen. Fixieren Sie mit den Augen einen festen Punkt an der Wand. Arme dürfen seitlich leicht ausgestreckt sein für Balance. Wenn Sie wackeln, greifen Sie kurz zur Wand. Versuchen Sie es dann erneut.',
coaching:['Ruhig stehen. Blick auf einen festen Punkt.','Atmen nicht vergessen. Ruhig durch die Nase.','Sehr gut gehalten. Bleiben Sie stabil.']},
supported:{hy:['II','III'],cue:'Hand an Wand · Fuß halb vor · ruhig halten',safety:'Eine Hand immer an Wand oder Stuhl. Andere Hand darf auch greifen. Nicht loslassen.',voice:'Halb-Tandem mit Halt.',audioDesc:'Eine Hand hält sich an der Wand oder Stuhllehne fest. Setzen Sie einen Fuß halb vor den anderen, Ferse auf Mitte des hinteren Fußes. Versuchen Sie, möglichst wenig Druck auf die Stützhand zu geben. Ruhig stehen, Blick geradeaus. Wenn Sie sich sicher fühlen, versuchen Sie nur die Fingerspitzen aufzulegen statt der ganzen Hand.',
coaching:['Hand gibt Sicherheit. Versuchen Sie wenig Druck.','Ruhig atmen. Blick geradeaus.','Gut gehalten. Gleich geschafft.']}}},
side_walk:{id:'side_walk',cat:'balance',name:'Seitgehen an der Wand',type:'time',baseSec:60,illus:'↔️',illusAlt:'Seitwärts gehen',citations:['mak2017','shu2014'],equipment:['wall'],variants:{
wall:{hy:['none','I','II'],cue:'Seitwärts an Wand · Schritt - Nachziehen · flüssig',safety:'Freier Boden ohne Teppichkanten oder Kabel. Hand leicht an der Wand. Bei Unsicherheit stärkeren Griff nehmen.',voice:'Seitwärts gehen an der Wand.',audioDesc:'Stellen Sie sich seitlich zur Wand, eine Hand leicht an der Wand. Machen Sie einen Schritt zur Seite mit dem wandfernen Fuß. Dann ziehen Sie den anderen Fuß nach. Schritt, nachziehen, Schritt, nachziehen. In eine Richtung gehen, dann umdrehen und zurück. Nicht überkreuzen, nur seitlich. Schritte etwa schulterbreit. Versuchen Sie, flüssig und rhythmisch zu gehen, nicht ruckartig.',
coaching:['Schritt, nachziehen. Schöner Rhythmus.','Hand leicht an der Wand. Blick geradeaus.','Richtung wechseln. Und zurück.','Flüssig und gleichmäßig. Sehr gut.','Letzte Sekunden. Weiter so.']},
chair_hold:{hy:['III'],cue:'Hand an Stuhllehne · kleine Seitschritte · sicher',safety:'Stabiler Stuhl auf rutschfestem Boden. Kleine Schritte, nicht überkreuzen.',voice:'Seitwärts mit Halt am Stuhl.',audioDesc:'Hand an einer stabilen Stuhllehne. Machen Sie kleine Seitschritte: einen Fuß zur Seite, den anderen nachziehen. Hin und her, etwa vier Schritte pro Richtung. Kleine, sichere Schritte. Füße nicht überkreuzen.',
coaching:['Kleine Schritte. Sicher und kontrolliert.','Richtung wechseln.','Gut gemacht. Weiter so.','Fast geschafft. Letzte Schritte.']}}},
big_steps:{id:'big_steps',cat:'balance',name:'Große Schritte gehen',type:'time',baseSec:90,illus:'👣',illusAlt:'Große Schritte',citations:['mak2017','shu2014'],variants:{
free:{hy:['none','I','II'],cue:'Betont GROSSE Schritte · Ferse zuerst · Arme schwingen',safety:'Freie Fläche von mindestens drei Metern. Keine Stolperfallen. Bei Unsicherheit Wand in Reichweite.',voice:'Große Schritte gehen.',audioDesc:'Gehen Sie auf einer freien Fläche betont große Schritte. Übertreiben Sie die Schrittlänge bewusst. Setzen Sie immer zuerst die Ferse auf, dann rollen Sie zum Zeh ab. Die Arme schwingen kräftig mit. Stellen Sie sich vor, Sie steigen über Pfützen. Das wirkt gezielt der Parkinson-typischen Schrittverkürzung entgegen. Wenn Sie am Ende des Raums ankommen, drehen Sie um und gehen zurück. Tempo: ruhig aber mit Nachdruck bei jedem Schritt.',
coaching:['GROSS denken. Übertreiben Sie die Schritte bewusst.','Ferse zuerst aufsetzen, dann abrollen.','Arme kräftig mitschwingen. Links-Rechts.','Umdrehen und zurück. Große Schritte.','Denken Sie bei jedem Schritt: GROSS. Ferse. Abrollen.','Sehr gut. Weiter große Schritte.']},
supported:{hy:['III'],cue:'An der Wand entlang · große Schritte · Ferse zuerst',safety:'Hand leicht an der Wand. Fester Boden. Bei Freezing: stoppen, Gewicht verlagern, dann neu starten.',voice:'Große Schritte mit Wandhalt.',audioDesc:'Gehen Sie entlang einer Wand, eine Hand leicht aufgelegt. Machen Sie betont große Schritte. Ferse zuerst aufsetzen. Freier Arm schwingt kräftig mit. Wenn Sie am Ende ankommen, umdrehen, andere Hand an die Wand, zurück. Bei einem Freezing-Angriff: stoppen, Gewicht von einem Fuß auf den anderen verlagern, dann bewusst den ersten großen Schritt machen.',
coaching:['Große Schritte. Hand nur als Sicherung.','Ferse zuerst. Bewusst abrollen.','Umdrehen und zurück.','Bei Freezing: stoppen, Gewicht verlagern, neu starten.','Weiter große Schritte. Sie machen das gut.']}}},
walk_cool:{id:'walk_cool',cat:'cardio',name:'Lockeres Gehen',type:'time',baseSec:300,illus:'🚶‍♂️',illusAlt:'Lockeres Gehen',citations:['colberg2016'],variants:{

standing:{hy:['none','I','II'],cue:'Kopf langsam drehen · Kinn senken · nie ruckartig',safety:'Bewegen Sie den Kopf immer langsam und kontrolliert, nie ruckartig. Bei Schwindel oder Taubheitsgefühl sofort stoppen. Augen dürfen dabei offen bleiben.',voice:'Nacken langsam mobilisieren.',audioDesc:'Stehen oder sitzen Sie aufrecht, Schultern entspannt. Drehen Sie den Kopf langsam nach links, als wollten Sie über die Schulter schauen. Drei Sekunden halten. Dann langsam zurück zur Mitte und nach rechts drehen. Drei Sekunden halten. Das ist eine Wiederholung. Dann senken Sie das Kinn langsam zur Brust, drei Sekunden, und zurück in die Mitte. Diese Übung löst die typische Nackensteifheit bei Parkinson und verbessert die Kopfbeweglichkeit im Alltag, zum Beispiel beim Schulterblick.'},

seated:{hy:['none','I','II','III'],cue:'Zehen hoch · Fersen hoch · abwechselnd pumpen',safety:'Sitzend auf stabilem Stuhl. Füße starten flach am Boden. Bei Wadenkrämpfen Pause machen und sanft dehnen.',voice:'Sprunggelenke pumpen im Sitzen.',audioDesc:'Setzen Sie sich aufrecht hin, Füße flach am Boden. Ziehen Sie zuerst die Zehen hoch, sodass nur die Fersen den Boden berühren. Kurz halten. Dann setzen Sie die Zehen ab und heben die Fersen, sodass Sie auf den Zehenspitzen stehen. Kurz halten. Abwechselnd: Zehen hoch, Fersen hoch, wie eine Pumpe. Tempo: ein Wechsel pro Sekunde. Diese Übung fördert die Durchblutung in den Beinen und beugt Thrombose vor. Besonders wichtig wenn Sie viel sitzen.'}}},

arms_up:{hy:['none','I','II'],cue:'Rücken an Wand · Arme hoch gleiten · Schulterblätter zusammen',safety:'Knie leicht gebeugt. Rücken und Kopf bleiben an der Wand. Bei Schulterschmerz nur so hoch wie schmerzfrei. Nicht ins Hohlkreuz gehen.',voice:'Brustwirbel strecken an der Wand.',audioDesc:'Stellen Sie sich mit dem Rücken an eine freie Wand. Knie leicht gebeugt, ganzer Rücken und Hinterkopf berühren die Wand. Arme an den Seiten, Ellbogen gebeugt, Handrücken an der Wand. Gleiten Sie nun die Arme langsam an der Wand nach oben, wie bei einer Hoch-die-Hände-Bewegung. Dabei die Schulterblätter bewusst zusammendrücken. So hoch wie schmerzfrei möglich. Dann langsam zurück. Tempo: drei Sekunden hoch, eine halten, drei Sekunden runter. Diese Übung wirkt der Parkinson-typischen Kyphose, also dem Rundrücken, gezielt entgegen.'},

trunk_rotation:{id:'trunk_rotation',cat:'posture',name:'Rumpf-Rotation',type:'reps',baseReps:6,baseSets:2,restSec:20,secsPerRep:4,illus:'🔄',illusAlt:'Rumpf drehen',citations:['mak2017'],variants:{

const DB_NAME='VitalPlanDB',DB_VERSION=3;let _dbP=null;
function openDB(){if(_dbP)return _dbP;_dbP=new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const db=e.target.result,old=e.oldVersion;if(old<1){const s=db.createObjectStore('sessions',{keyPath:'id'});s.createIndex('date','date');db.createObjectStore('kv',{keyPath:'id'});}if(old<2)db.createObjectStore('benchmarks',{keyPath:'id'});if(old<3){const ns=db.createObjectStore('nutrition',{keyPath:'id'});ns.createIndex('date','date');const ws=db.createObjectStore('wellbeing',{keyPath:'id'});ws.createIndex('date','date');}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return _dbP;}
async function idbGet(s,id){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(s,'readonly').objectStore(s).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbPut(s,o){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>res(o);r.onerror=()=>rej(r.error);});}
async function idbAll(s){const db=await openDB();return new Promise((res,rej)=>{const out=[];const r=db.transaction(s,'readonly').objectStore(s).openCursor();r.onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out);};r.onerror=()=>rej(r.error);});}
async function idbDel(s,id){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

/* ===== NARRATOR (ARIA Live + Speech Synthesis) ===== */
class Narrator{
constructor(){this.liveEl=null;this.assertiveEl=null;this.last='';this.lastT=0;this.sections=[];this.currentSection=0;this._paused=false;this.speaking=false;this._speakTimeout=null;this._onDoneCallback=null;}
init(){this.liveEl=document.getElementById('live-polite');this.assertiveEl=document.getElementById('live-assertive');}
_voiceOn(){return !!STATE.profile?.voiceCues;}
_fullOn(){return !!STATE.profile?.a11y?.fullNarration;}
_live(t,a){const el=a?this.assertiveEl:this.liveEl;if(!el)return;el.textContent='';setTimeout(()=>{if(el)el.textContent=t;},30);}
_speak(t,intr,onDone){if(!this._voiceOn()||!('speechSynthesis'in window)){if(onDone)setTimeout(onDone,100);return;}const n=Date.now();if(this.last===t&&n-this.lastT<800){if(onDone)setTimeout(onDone,100);return;}this.last=t;this.lastT=n;clearTimeout(this._speakTimeout);this._onDoneCallback=null;try{if(intr)window.speechSynthesis.cancel();this.speaking=true;this._updateFab();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=STATE.profile?.a11y?.voiceRate||0.92;u.pitch=1;let ended=false;const finish=()=>{if(ended)return;ended=true;clearTimeout(this._speakTimeout);this.speaking=false;this._updateFab();if(onDone)onDone();};u.onend=finish;u.onerror=finish;const est=(t.split(' ').length*350)+1500;this._speakTimeout=setTimeout(finish,est);window.speechSynthesis.speak(u);}catch(e){this.speaking=false;this._updateFab();if(onDone)onDone();}}
_updateFab(){const fab=document.getElementById('a11y-fab');if(!fab)return;fab.classList.toggle('fab-speaking',this.speaking&&!voiceInput?.isListening);fab.classList.toggle('fab-listening',!!voiceInput?.isListening);fab.querySelector('span').textContent=voiceInput?.isListening?'🎤':'🔊';}
cue(t,onDone){this._speak(t,true,onDone);}
announce(t,onDone){this._live(t,false);this._speak(t,false,onDone);}
critical(t,onDone){this._live(t,true);this._speak(t,true,onDone);}
describe(t,onDone){this._live(t,false);if(this._fullOn())this._speak(t,true,onDone);else if(onDone)setTimeout(onDone,100);}
guide(t,onDone){this._live(t,false);if(this._voiceOn())this._speak(t,true,onDone);else if(onDone)setTimeout(onDone,100);}
viewChanged(title,desc){const full=this._fullOn()?`${title} ${desc}`:title;this._live(full||desc,false);if(this._fullOn())this._speak(desc,true);}
queueSections(texts){this.sections=texts;this.currentSection=0;this._paused=false;if(texts.length>0)this._speak(texts[0],true);}
nextSection(){if(this.currentSection<this.sections.length-1){this.currentSection++;this._speak(this.sections[this.currentSection],true);this._live(`Abschnitt ${this.currentSection+1} von ${this.sections.length}`,false);}return this.getSectionProgress();}
prevSection(){if(this.currentSection>0){this.currentSection--;this._speak(this.sections[this.currentSection],true);this._live(`Abschnitt ${this.currentSection+1} von ${this.sections.length}`,false);}return this.getSectionProgress();}
pauseResume(){try{if(this._paused){window.speechSynthesis?.resume();this._paused=false;}else{window.speechSynthesis?.pause();this._paused=true;}}catch(e){}return this._paused;}
stop(){try{window.speechSynthesis?.cancel();}catch(e){}clearTimeout(this._speakTimeout);this.speaking=false;this._updateFab();}
getSectionProgress(){return{current:this.currentSection+1,total:this.sections.length,paused:this._paused};}
}

const _SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function extractNumberFromGerman(text){
const t=text.toLowerCase().replace(/[.,!?]/g,'').trim();
const dm=t.match(/\d+/);if(dm)return parseInt(dm[0],10);
const singles={'null':0,'eins':1,'ein':1,'eine':1,'zwei':2,'zwo':2,'drei':3,'vier':4,'fünf':5,'sechs':6,'sieben':7,'acht':8,'neun':9,'zehn':10,'elf':11,'zwölf':12,'dreizehn':13,'vierzehn':14,'fünfzehn':15,'sechzehn':16,'siebzehn':17,'achtzehn':18,'neunzehn':19,'zwanzig':20,'dreißig':30,'vierzig':40,'fünfzig':50,'sechzig':60,'siebzig':70,'achtzig':80,'neunzig':90,'hundert':100};
for(const w in singles)if(t===w||t===w+'s')return singles[w];
const compM=t.match(/(ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun)und(zwanzig|dreißig|vierzig|fünfzig|sechzig|siebzig|achtzig|neunzig)/);
if(compM){const ones={'ein':1,'zwei':2,'drei':3,'vier':4,'fünf':5,'sechs':6,'sieben':7,'acht':8,'neun':9};const tens={'zwanzig':20,'dreißig':30,'vierzig':40,'fünfzig':50,'sechzig':60,'siebzig':70,'achtzig':80,'neunzig':90};if(ones[compM[1]]!=null&&tens[compM[2]]!=null)return ones[compM[1]]+tens[compM[2]];}
const hM=t.match(/(ein)?hundert(und)?(.*)/);
if(hM){let rest=0;if(hM[3]){const rn=extractNumberFromGerman(hM[3]);if(rn!=null)rest=rn;}return 100+rest;}
for(const w in singles)if(t.includes(w))return singles[w];
return null;
}
class VoiceInput{
constructor(){this._recognition=null;this._listening=false;}
get supported(){return !!_SpeechRec&&STATE.profile?.a11y?.voiceInput!==false;}
get isListening(){return this._listening;}
stop(){if(this._recognition){try{this._recognition.abort();}catch(e){}this._recognition=null;}this._listening=false;narrator._updateFab();}
startNumberInput({onResult,onError,lang}={lang:'de-DE'}){
if(!this.supported){narrator.cue('Spracheingabe auf diesem Gerät nicht verfügbar. Bitte tippen Sie die Zahl ein.');if(onError)onError();return;}
narrator.stop();this.stop();
setTimeout(()=>{
const rec=new _SpeechRec();rec.lang=lang||'de-DE';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
this._recognition=rec;this._listening=true;narrator._updateFab();render();
rec.onresult=e=>{const txt=e.results[0][0].transcript;const num=extractNumberFromGerman(txt);if(num!=null){narrator.cue(`Ich habe ${num} verstanden.`);if(onResult)onResult(num);}else{narrator.cue('Nicht verstanden. Bitte tippen Sie die Zahl ein.');if(onError)onError();}};
rec.onerror=()=>{narrator.cue('Mikrofon funktioniert nicht. Bitte tippen.');if(onError)onError();};
rec.onend=()=>{this._listening=false;this._recognition=null;narrator._updateFab();render();};
try{rec.start();}catch(e){this._listening=false;narrator._updateFab();if(onError)onError();}
},250);
}
startKeywordInput({keywords,onMatch,onNoMatch,lang}={lang:'de-DE'}){
if(!this.supported){if(onNoMatch)onNoMatch('');return;}
narrator.stop();this.stop();
setTimeout(()=>{
const rec=new _SpeechRec();rec.lang=lang||'de-DE';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
this._recognition=rec;this._listening=true;narrator._updateFab();render();
rec.onresult=e=>{const txt=e.results[0][0].transcript.toLowerCase().trim();const num=extractNumberFromGerman(txt);if(num!=null){if(onMatch)onMatch(num);return;}const found=keywords?.find(k=>txt.includes(k.toLowerCase()));if(found){if(onMatch)onMatch(found);}else{if(onNoMatch)onNoMatch(txt);}};
rec.onerror=()=>{if(onNoMatch)onNoMatch('');};
rec.onend=()=>{this._listening=false;this._recognition=null;narrator._updateFab();render();};
try{rec.start();}catch(e){this._listening=false;narrator._updateFab();if(onNoMatch)onNoMatch('');}
},250);
}
}

function evalGlucose(mg,type){if(mg==null||isNaN(mg))return null;if(mg<70)return{level:'stop',title:'Zu niedrig · Hypo-Gefahr',msg:'15 bis 20 Gramm schnelle Kohlenhydrate. 15 Min warten, neu messen. Erst starten wenn stabil über 90.'};if(mg<90)return{level:'warn',title:'Grenzwertig niedrig',msg:'Vor Training 15 bis 20 g KH. 10 bis 15 Min warten.'};if(mg<=126)return{level:'warn',title:'Niedrig-normal',msg:'Für Kraft und Balance vertretbar. Für längeres Gehen Snack erwägen.'};if(mg<=180)return{level:'ok',title:'Optimaler Bereich',msg:'Günstiger Ausgangswert.'};if(mg<=250)return{level:'warn',title:'Erhöht',msg:type==='T1'?'Bei Unwohlsein Ketone messen.':'Training OK. Viel trinken.'};return{level:'stop',title:'Zu hoch · Keton-Gefahr',msg:type==='T1'?'Über 250: Ketone zwingend prüfen. Bei Ketonen moderat oder hoch: nicht trainieren.':'Sehr hoch. Heute nur ruhiges Gehen bei Wohlbefinden.'};}
function evalKetones(l){if(!l||l==='none')return null;if(l==='trace')return{level:'warn',title:'Spuren von Ketonen',msg:'Ruhig bleiben, trinken, leichte Bewegung nur bei Wohlbefinden.'};return{level:'stop',title:'Moderate oder hohe Ketone',msg:'Heute nicht trainieren. Insulinschema prüfen.'};}

/* ===== BUILDER ===== */
const PHASE_ORDER=['warmup','strength','posture','balance','cardio','cooldown'];
const PHASE_LABELS={warmup:'Aufwärmen',strength:'Kraft',posture:'Haltung',balance:'Gleichgewicht',cardio:'Ausdauer',cooldown:'Cool-down'};
const PHASE_DESCS={warmup:'Kreislauf aktivieren und Gelenke mobilisieren.',strength:'Muskelkraft aufbauen und erhalten.',posture:'Haltung verbessern, Steifigkeit reduzieren.',balance:'Gleichgewicht und Gangsicherheit trainieren.',cardio:'Ausdauer und Herz-Kreislauf stärken.',cooldown:'Entspannung und Flexibilität.'};
/* Volle Übungsbibliothek. buildWorkout() wählt pro Session eine rotierende Teilmenge:
   - Kern-Übungen (immer enthalten): march, sit_to_stand, walk_cool, breathing
   - Rotierende Übungen: je Phase 1-2 aus dem Pool (wechselt je Session)
   - Gesamt pro Session: ~8-10 Übungen ≈ 25 Min.
   - Alle Übungen kommen über mehrere Sessions dran → Vielfalt + Progression */
const PHASE_POOL={
warmup:['march','trunk_rotation','big_arms','weight_shift','neck_mob','ankle_pump'],
strength:['sit_to_stand','calf_raise','chair_squat'],
posture:['bottle_row','wall_pushup','thoracic_ext','trunk_rotation'],
balance:['half_tandem','side_walk','big_steps','heel_toe_walk'],
cardio:['walk_cool'],
cooldown:['breathing','static_stretch']
};
const PHASE_CORE={warmup:['march'],strength:['sit_to_stand'],posture:[],balance:[],cardio:['walk_cool'],cooldown:['breathing']};
const PHASE_PICK={warmup:1,strength:1,posture:1,balance:2,cardio:0,cooldown:0};
function pickVariant(ex,hy){for(const k in ex.variants){const v=ex.variants[k];if(v.hy.includes(hy))return v.skip?null:v;}const f=Object.values(ex.variants)[0];return f.skip?null:f;}
function hasEquipment(ex,eq){if(!ex.equipment)return true;for(const n of ex.equipment){if(n==='chair'&&!eq.chair)return false;if(n==='wall'&&!eq.wall)return false;if(n==='wall_or_chair'&&!eq.wall&&!eq.chair)return false;if(n==='weights'&&!eq.weights)return false;if(n==='step'&&!eq.step)return false;}return true;}
function buildWorkout(){
const p=STATE.profile,plan=STATE.plan,hy=p.parkinsonStage;
const dF=plan.inDeload?0.7:1.0;
const repMult=plan.strengthRepsMultiplier*dF,balMult=plan.balanceSecMultiplier*dF;
const sets=Math.max(1,Math.round(plan.strengthSets*(plan.inDeload?0.75:1)));
const walkMin=Math.max(3,Math.round(plan.walkMinutes*dF));
const sessionNum=STATE.sessions.length;
const blocks=[];
for(const phase of PHASE_ORDER){
/* Rotation: Kern-Übungen + rotierende Auswahl aus Pool */
const pool=PHASE_POOL[phase]||[];
const coreIds=PHASE_CORE[phase]||[];
const rotateIds=pool.filter(id=>!coreIds.includes(id));
const pickCount=PHASE_PICK[phase]!=null?PHASE_PICK[phase]:rotateIds.length;
const selectedIds=[...coreIds];
let picked=0,offs=sessionNum;
while(picked<pickCount&&offs-sessionNum<rotateIds.length*2){
const cand=rotateIds[offs%rotateIds.length];
if(!selectedIds.includes(cand)){
const ex=EX[cand];
if(ex){const v=pickVariant(ex,hy);if(v&&hasEquipment(ex,p.equipment)){selectedIds.push(cand);picked++;}}
}offs++;
}
const phaseBlocks=[];
for(const eid of selectedIds){
const ex=EX[eid];if(!ex)continue;
const v=pickVariant(ex,hy);if(!v)continue;
if(!hasEquipment(ex,p.equipment))continue;
const b={id:ex.id,name:ex.name,cat:ex.cat,phase,type:ex.type,illus:ex.illus,illusAlt:ex.illusAlt,cue:v.cue,safety:v.safety,voice:v.voice,audioDesc:v.audioDesc,coaching:v.coaching||[],citations:ex.citations};
if(ex.type==='time'){const sec=ex.id==='walk_cool'?walkMin*60:(ex.cat==='balance'?Math.round(ex.baseSec*balMult):ex.baseSec);b.sec=sec;b.sets=ex.baseSets||1;}
else{b.reps=Math.max(3,Math.round(ex.baseReps*(ex.cat==='strength'?repMult:1)));b.sets=ex.cat==='strength'?sets:(ex.baseSets||1);b.restSec=ex.restSec||30;b.secsPerRep=ex.secsPerRep||5;b.setSec=b.reps*b.secsPerRep;}
phaseBlocks.push(b);
}
if(phaseBlocks.length>0){
blocks.push({isPhaseHeader:true,phase,label:PHASE_LABELS[phase],desc:PHASE_DESCS[phase]});
blocks.push(...phaseBlocks);
}
}
let tot=0;for(const b of blocks){if(b.isPhaseHeader)continue;if(b.type==='time')tot+=(b.sec||0)*(b.sets||1)+15*Math.max(0,(b.sets||1)-1);else tot+=(b.setSec||b.reps*5)*(b.sets||1)+(b.restSec||30)*Math.max(0,(b.sets||1)-1);}
return{blocks,estimatedMin:Math.max(1,Math.round(tot/60)),isDeload:plan.inDeload};
}

/* ===== PROGRESSION ===== */
function sessionsInWeek(start,end){return STATE.sessions.filter(s=>{const d=new Date(s.startedAt);return d>=start&&d<end;});}
function isProblem(s){if(s.stopReason)return true;if(s.preGlucose!=null&&s.preGlucose<70)return true;if(s.postGlucose!=null&&s.postGlucose<70)return true;if(s.freezing!=null&&s.freezing>=4)return true;return false;}
function evaluateCurrentWeek(){
const target=STATE.profile.targetSessionsPerWeek;
const start=mondayOf(new Date());const end=new Date(start);end.setDate(end.getDate()+7);
const sess=sessionsInWeek(start,end).filter(s=>!s.isBaseline);
const count=sess.length;
const avgRpe=count?sess.reduce((a,s)=>a+(s.rpe||5),0)/count:0;
const reasons=[];let stable=true;
if(STATE.plan.baselineSessionsRemaining>0){stable=false;reasons.push(`Noch ${STATE.plan.baselineSessionsRemaining} Kalibrier-Einheit(en)`);}
if(count<target){stable=false;reasons.push(`${target-count} Einheit(en) bis Wochenziel`);}
if(avgRpe>6.5){stable=false;reasons.push(`Durchschnitts-RPE hoch (${avgRpe.toFixed(1)})`);}
if(sess.some(isProblem)){stable=false;reasons.push('Sicherheitsereignis aufgetreten');}
return{count,target,avgRpe,stable,reasons,sessions:sess};
}
function shouldOfferProgression(){const p=STATE.plan;if(p.inDeload)return false;if(p.baselineSessionsRemaining>0)return false;return p.consecutiveStableWeeks>=2;}
function shouldTriggerDeload(){return STATE.plan.progressionsSinceDeload>=4&&!STATE.plan.inDeload;}
function getProgressionOptions(){const p=STATE.plan;return[
{id:'walk+3',label:'+3 Min Gehen am Ende',detail:`${p.walkMinutes} → ${p.walkMinutes+3} Min`,apply:pl=>{pl.walkMinutes+=3;}},
{id:'reps+10',label:'+10 % Wiederholungen (Kraft)',detail:`${p.strengthRepsMultiplier.toFixed(2)} → ${(p.strengthRepsMultiplier+0.1).toFixed(2)}`,apply:pl=>{pl.strengthRepsMultiplier=Math.min(1.8,pl.strengthRepsMultiplier+0.1);}},
{id:'set+1',label:'+1 Satz (Kraft)',detail:`${p.strengthSets} → ${p.strengthSets+1}`,apply:pl=>{pl.strengthSets=Math.min(4,pl.strengthSets+1);}},
{id:'balance+20',label:'+20 % Balance-Dauer',detail:`${p.balanceSecMultiplier.toFixed(2)} → ${(p.balanceSecMultiplier+0.2).toFixed(2)}`,apply:pl=>{pl.balanceSecMultiplier=Math.min(2.0,pl.balanceSecMultiplier+0.2);}}
];}
async function applyProgression(id){const o=getProgressionOptions().find(x=>x.id===id);if(!o)return;o.apply(STATE.plan);STATE.plan.lastProgressionDate=new Date().toISOString();STATE.plan.consecutiveStableWeeks=0;STATE.plan.progressionsSinceDeload+=1;STATE.plan.progressionHistory.push({date:new Date().toISOString(),change:o.label,plan:snapshotPlan()});await savePlan();narrator.announce(`Steigerung angewendet: ${o.label}`);}
async function startDeload(){STATE.plan.inDeload=true;STATE.plan.lastDeloadDate=new Date().toISOString();await savePlan();narrator.announce('Deload-Woche gestartet. Volumen auf 70 Prozent reduziert.');}

function snapshotPlan(){const p=STATE.plan;return{walkMinutes:p.walkMinutes,strengthSets:p.strengthSets,strengthRepsMultiplier:p.strengthRepsMultiplier,balanceSecMultiplier:p.balanceSecMultiplier};}
async function maybeCloseWeek(){const plan=STATE.plan;const pS=new Date(plan.weekStartIso);const cS=mondayOf(new Date());if(cS<=pS)return;const wks=Math.floor(Math.round((cS-pS)/86400000)/7);for(let i=0;i<wks;i++){const wS=new Date(pS);wS.setDate(wS.getDate()+i*7);const wE=new Date(wS);wE.setDate(wE.getDate()+7);const sess=sessionsInWeek(wS,wE).filter(s=>!s.isBaseline);const cnt=sess.length;const avgRpe=cnt?sess.reduce((a,s)=>a+(s.rpe||5),0)/cnt:0;const stab=cnt>=STATE.profile.targetSessionsPerWeek&&avgRpe<=6.5&&!sess.some(isProblem);if(plan.inDeload)await endDeload();else if(stab)plan.consecutiveStableWeeks+=1;else plan.consecutiveStableWeeks=0;plan.weekNumber+=1;}plan.weekStartIso=cS.toISOString();await savePlan();}

class MonoTimer{
constructor(sec,onTick,onDone,opts={}){this.sec=sec;this.totalSec=sec;this.onTick=onTick;this.onDone=onDone;this.endAt=null;this.paused=null;this.h=null;this.lastBeep=null;this.lastSpoken=null;this.speakCountdown=opts.speakCountdown!==false;this._halfSpoken=false;this._coachingCues=opts.coaching||[];this._cuesFired=new Set();}
start(){this.endAt=performance.now()+this.sec*1000;this._tick();this.h=setInterval(()=>this._tick(),200);}
_tick(){const rem=Math.max(0,Math.ceil((this.endAt-performance.now())/1000));this.onTick?.(rem);if(rem<=3&&rem>0&&this.lastBeep!==rem){beep(600,80);haptic(HAPTIC.TICK);this.lastBeep=rem;}if(this.speakCountdown){const half=Math.floor(this.totalSec/2);if(rem===half&&!this._halfSpoken&&this.totalSec>=20){this._halfSpoken=true;narrator.cue('Die Hälfte ist geschafft.');}/* coaching cues at intervals */if(this._coachingCues.length>0&&this.totalSec>=30){const elapsed=this.totalSec-rem;const interval=Math.floor(this.totalSec/(this._coachingCues.length+1));for(let ci=0;ci<this._coachingCues.length;ci++){const trigAt=(ci+1)*interval;if(elapsed===trigAt&&!this._cuesFired.has(ci)&&rem>12){this._cuesFired.add(ci);narrator.cue(this._coachingCues[ci]);}}}if(this.lastSpoken!==rem){const map={10:'Noch zehn Sekunden',5:'Fünf',4:'Vier',3:'Drei',2:'Zwei',1:'Eins'};if(map[rem]){narrator.cue(map[rem]);this.lastSpoken=rem;}}}if(rem<=0){clearInterval(this.h);this.h=null;beep(880,220);haptic(HAPTIC.DONE);this.onDone?.();}}
pause(){if(!this.h)return;clearInterval(this.h);this.h=null;this.paused=Math.max(0,Math.ceil((this.endAt-performance.now())/1000));}
resume(){if(this.paused==null)return;this.endAt=performance.now()+this.paused*1000;this.paused=null;this._tick();this.h=setInterval(()=>this._tick(),200);}
isPaused(){return this.paused!=null;}
stop(){if(this.h)clearInterval(this.h);this.h=null;}
snapshot(){return this.paused!=null?this.paused:Math.max(0,Math.ceil((this.endAt-performance.now())/1000));}
}

function h(tag,attrs={},...kids){const el=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k==='style'&&typeof v==='string')el.setAttribute('style',v);else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v);}for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.appendChild(typeof kid==='string'||typeof kid==='number'?document.createTextNode(String(kid)):kid);}return el;}

function lineChart(data,opts={}){const W=300,H=80,P=8;if(!data||data.length===0)return h('div',{class:'chart-empty'},'Noch keine Daten');const vals=data.map(d=>d.value);const min=opts.min!=null?opts.min:Math.min(...vals);const max=opts.max!=null?opts.max:Math.max(...vals);const range=max-min||1;const stepX=data.length===1?0:(W-2*P)/(data.length-1);const pts=data.map((d,i)=>{const x=P+i*stepX;const y=P+(1-(d.value-min)/range)*(H-2*P);return[x,y];});const pathD=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');const color=opts.color||'#1e40af';const aria=opts.ariaLabel||`Verlauf, ${data.length} Werte, von ${data[0].value} auf ${data[data.length-1].value}`;const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${aria}"><path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}"/>`).join('')}</svg>`;const w=h('div',{html:svg});return w.firstChild;}

w.appendChild(h('div',{class:'reps-display','aria-hidden':'true'},h('span',{class:'reps-big'},String(m.count||0)),h('span',{class:'reps-total'},'Wdh.')));
w.appendChild(h('div',{class:'sr-only','aria-live':'polite','aria-atomic':'true'},`${m.count||0} Wiederholungen`));
w.appendChild(h('button',{class:'btn big success','aria-label':`Aufstehen zählen. Aktuell ${m.count||0}.`,onclick:()=>{m.count=(m.count||0)+1;haptic(HAPTIC.REP);beep(440,50);if(STATE.profile.a11y.fullNarration)narrator.cue(String(m.count));render();}},'+1 Aufstehen'));
w.appendChild(h('div',{class:'btn-row'},h('button',{class:'btn secondary',onclick:()=>{m.count=Math.max(0,(m.count||0)-1);render();}},'−1'),voiceInput.supported?h('button',{class:'mic-btn'+(voiceInput.isListening?' mic-listening':''),style:'margin-bottom:0',onclick:()=>{voiceInput.startNumberInput({onResult:num=>{m.count=num;narrator.cue(`${num} Wiederholungen korrigiert.`);render();},onError:()=>{render();}});}},voiceInput.isListening?'🔴 Höre...':'🎤 Korrektur'):null));
}
else if(t.type==='time'){
if(!m.startTime){w.appendChild(h('p',{style:'margin-bottom:12px'},'Beim Drücken startet die Messung. Am Ziel nochmal drücken.'));w.appendChild(h('button',{class:'btn big success',onclick:()=>{m.startTime=performance.now();beep(880,200);narrator.cue('Los.');render();}},'Jetzt starten'));}
else{const el=(performance.now()-m.startTime)/1000;w.appendChild(h('div',{class:'timer-huge','aria-hidden':'true'},el.toFixed(1)));w.appendChild(h('div',{class:'timer-label'},'Sekunden'));w.appendChild(h('button',{class:'btn big danger',onclick:()=>{m.value=Math.round(((performance.now()-m.startTime)/1000)*10)/10;m.step=2;beep(880,300);narrator.critical(`Test fertig. ${m.value} Sekunden.`);render();}},'⏹  Angekommen'));setTimeout(()=>{if(STATE.modal===m&&m.step===1&&m.startTime&&!m.value)render();},100);}
}
else if(t.type==='speed'){

else{const el=(performance.now()-m.startTime)/1000;w.appendChild(h('div',{class:'timer-huge','aria-hidden':'true'},el.toFixed(1)));w.appendChild(h('div',{class:'timer-label'},'Sekunden · 4 m'));w.appendChild(h('button',{class:'btn big danger',onclick:()=>{const s=(performance.now()-m.startTime)/1000;m.value=Math.round((t.distanceM/s)*100)/100;m.step=2;beep(880,300);narrator.critical(`${m.value} Meter pro Sekunde.`);render();}},'⏹  Ziel überschritten'));setTimeout(()=>{if(STATE.modal===m&&m.step===1&&m.startTime&&!m.value)render();},100);}
}
w.appendChild(h('button',{class:'btn ghost',onclick:()=>{m.timer?.stop();STATE.modal=null;render();restoreFocus();}},'Abbrechen'));
}
else if(m.step===2){

if(cls)w.appendChild(h('p',{class:'text-muted'},cls));

if(prev){const d=v-prev.value;const imp=t.higherIsBetter?d>0:d<0;w.appendChild(h('p',{style:'margin-top:10px;font-weight:600;color:'+(imp?'#059669':'#dc2626')},`${imp?'✓ Verbesserung':'↓ Rückgang'}: ${d>0?'+':''}${d.toFixed(1)} gegenüber vorher (${prev.value})`));}

}
return w;

/* ===== GUIDED TOUR ===== */
const GuidedTour={
steps:[
{sel:'.bottom-nav',text:'Navigation: Wechseln Sie zwischen den Bereichen der App. Jeder Tab hat eine eigene Funktion.',pos:'top'},
{sel:'.btn.big',text:'Start-Button: Hiermit beginnen Sie Ihr Training. Ein Sicherheitscheck wird vorgeschaltet.',pos:'top'},
{sel:'.a11y-fab',text:'Vorlese-Button: Tippen Sie hier, um sich den aktuellen Bildschirm vorlesen zu lassen.',pos:'bottom'},
{sel:'.bottom-nav .nav-item:last-child',text:'Hilfe-Bereich: Hier finden Sie die Anleitung, Einstellungen und wissenschaftliche Hintergründe.',pos:'top'}
],
_idx:0,_overlay:null,
start(){if(!this.steps.length)return;this._idx=0;this._show();},
_show(){this._remove();if(this._idx>=this.steps.length){this._finish();return;}
const step=this.steps[this._idx];const el=document.querySelector(step.sel);
const ov=document.createElement('div');ov.className='tour-overlay';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Geführte Tour');
const card=document.createElement('div');card.className='tour-card';
if(el){const r=el.getBoundingClientRect();const spot=document.createElement('div');spot.className='tour-spot';spot.style.cssText=`top:${r.top-6}px;left:${r.left-6}px;width:${r.width+12}px;height:${r.height+12}px`;ov.appendChild(spot);
card.style.top=step.pos==='top'?`${Math.max(10,r.top-180)}px`:`${r.bottom+16}px`;}
card.innerHTML=`<p style="margin-bottom:14px;line-height:1.5">${step.text}</p><p style="font-size:14px;color:#475569;margin-bottom:14px">Schritt ${this._idx+1} von ${this.steps.length}</p>`;
const bRow=document.createElement('div');bRow.style.cssText='display:flex;gap:10px';
const bSpeak=document.createElement('button');bSpeak.className='btn secondary';bSpeak.style.cssText='min-height:64px;flex:1';bSpeak.textContent='🔊 Vorlesen';bSpeak.onclick=()=>narrator.cue(step.text);
const bNext=document.createElement('button');bNext.className='btn';bNext.style.cssText='min-height:64px;flex:1';bNext.textContent=this._idx<this.steps.length-1?'Weiter ➜':'Fertig ✓';bNext.onclick=()=>{this._idx++;this._show();};
const bSkip=document.createElement('button');bSkip.className='btn ghost';bSkip.style.cssText='min-height:52px;flex:1';bSkip.textContent='Überspringen';bSkip.onclick=()=>this._finish();
bRow.appendChild(bSpeak);bRow.appendChild(bNext);card.appendChild(bRow);
if(this._idx<this.steps.length-1){const bRow2=document.createElement('div');bRow2.style.cssText='margin-top:8px';bRow2.appendChild(bSkip);card.appendChild(bRow2);}
ov.appendChild(card);document.body.appendChild(ov);this._overlay=ov;narrator.cue(step.text);bNext.focus();},
_remove(){if(this._overlay){this._overlay.remove();this._overlay=null;}},
_finish(){this._remove();if(STATE.profile){STATE.profile.a11y.tourCompleted=true;saveProfile();}narrator.announce('Tour abgeschlossen.');}
};
