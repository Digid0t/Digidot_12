const ms=inferMedicationState();
if(ms==='ON')body+='Ihr Medikament wirkt gerade — optimaler Zeitpunkt.';
else if(ms==='wearing-off')body+='Wearing-Off Phase — bald nächste Dosis?';
else body+='Prüfen Sie Ihren Medikationsstatus.';
}else{const wk=evaluateCurrentWeek();body+=`Diese Woche: ${wk.count} von ${wk.target} Einheiten.`;}
sendNotification('VitalPlan — Training',body,'reminder');
/* Benchmark-Erinnerung */
if(benchIsDue()){sendNotification('VitalPlan — Messung fällig','Ihre 4-Wochen-Messung steht an. Testen Sie Ihre Fortschritte!','bench-reminder');}
/* Diabetes: BZ-Check Erinnerung */
if(p.diabetesType!=='none'){
const lastSess=STATE.sessions[0];
if(lastSess&&!sessToday.length){const sinceLast=Math.round((now-new Date(lastSess.startedAt))/3600000);
if(sinceLast>=2&&sinceLast<=8&&p.diabetesType==='T1'){sendNotification('VitalPlan — Blutzucker prüfen',`${sinceLast} Stunden nach Training. Späte Unterzuckerung möglich (Riddell 2017).`,'hypo-reminder');}}}
},60000);
}

/* ===== INIT ===== */
(async function init(){
try{
await loadAll();
narrator.init();
await maybeCloseWeek();
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
/* --- PWA Service Worker Registration --- */
if ('serviceWorker' in navigator) {
  // Clevere Abfrage: Nur ausführen, wenn wir nicht im lokalen Dateisystem sind
  if (window.location.protocol !== 'file:') {
    try {
      const swReg = await navigator.serviceWorker.register('./sw.js', {scope: './'});
      swReg.addEventListener('updatefound', () => {
        const nw = swReg.installing;
        if (nw) nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage({type: 'SKIP_WAITING'});
            narrator.announce('VitalPlan wurde aktualisiert. Seite wird neu geladen.');
            setTimeout(() => location.reload(), 1500);
          }
        });
      });
      /* Periodic Background Sync für Erinnerungen */
      if (swReg.periodicSync) {
        try { await swReg.periodicSync.register('vitalplan-reminder-check', {minInterval: 60 * 60 * 1000}); } catch (e) {}
      }
      /* Notification-Schedules an SW senden */
      if (STATE.profile?.reminderEnabled && STATE.profile?.reminderTime) {
        const [rh, rm] = STATE.profile.reminderTime.split(':').map(Number);
        const now = new Date();
        const sched = new Date(now);
        sched.setHours(rh, rm, 0, 0);
        if (sched <= now) sched.setDate(sched.getDate() + 1);
        navigator.serviceWorker.ready.then(r => {
          if (r.active) r.active.postMessage({type: 'SCHEDULE_NOTIFICATION', payload: {title: 'VitalPlan Erinnerung', body: 'Zeit für Ihr Training! Starten Sie jetzt Ihre Übungen.', tag: 'vitalplan-training-daily', scheduledTime: sched.toISOString(), recurring: true, recurringTime: STATE.profile.reminderTime}});
        });
      }
    } catch (err) {
      // Fängt alle anderen Fehler ab (z.B. sw.js Datei fehlt, Browser blockiert es)
      console.warn('PWA-Info: Service Worker nicht registriert (Offline-Modus inaktiv). Grund:', err.message);
    }
  } else {
    console.log('PWA-Info: Lokale Datei (file://) erkannt. Service Worker wird übersprungen.');
  }
}
/* --- PWA Install Prompt --- */
let _deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_deferredInstallPrompt=e;showInstallBanner();});
window.addEventListener('appinstalled',()=>{_deferredInstallPrompt=null;hideInstallBanner();narrator.announce('VitalPlan wurde erfolgreich als App installiert! Sie finden die App jetzt auf Ihrem Startbildschirm.');});
function showInstallBanner(){let b=document.getElementById('pwa-install-banner');if(b)return;b=document.createElement('div');b.id='pwa-install-banner';b.setAttribute('role','alert');b.style.cssText='position:fixed;bottom:80px;left:12px;right:12px;background:linear-gradient(135deg,#1e40af,#1e3a8a);color:#fff;padding:20px;border-radius:20px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:12px;animation:slideUp 0.4s ease';
b.innerHTML=`<div style="display:flex;align-items:center;gap:12px"><span style="font-size:40px">📲</span><div><div style="font-size:20px;font-weight:700">VitalPlan installieren</div><div style="font-size:16px;opacity:0.9">Als App auf dem Startbildschirm — offline verfügbar, Benachrichtigungen, schnellerer Zugriff</div></div></div><div style="display:flex;gap:10px"><button id="pwa-install-btn" style="flex:1;padding:14px;font-size:18px;font-weight:700;background:#fff;color:#1e40af;border:none;border-radius:14px;cursor:pointer;min-height:52px">✓ Jetzt installieren</button><button id="pwa-dismiss-btn" style="padding:14px 20px;font-size:16px;background:rgba(255,255,255,0.2);color:#fff;border:2px solid rgba(255,255,255,0.4);border-radius:14px;cursor:pointer;min-height:52px">Später</button></div>`;
document.body.appendChild(b);narrator.cue('VitalPlan kann als App installiert werden. Sie erhalten dann Benachrichtigungen und können offline trainieren. Tippen Sie auf Jetzt installieren oder auf Später.');
document.getElementById('pwa-install-btn').addEventListener('click', async () => {
document.getElementById('pwa-install-btn').addEventListener('click', async () => {

    const installPrompt = _deferredInstallPrompt;

    // Check whether installation is supported
    if (!installPrompt) {
        const message =
            'App installation is not available through this browser right now. ' +
            'Please check your browser menu for an Install App option.';

        narrator.cue(message);
        alert(message);

        hideInstallBanner();
        return;
    }

    try {
        // Show the browser installation prompt
        await installPrompt.prompt();

        const result = await installPrompt.userChoice;

        if (result.outcome === 'accepted') {
            narrator.announce('Installation started successfully.');
        } else {
            narrator.cue('Installation was cancelled. You can try again later.');
        }

    } catch (error) {
        const message =
            'Unable to start app installation. Please try again using your browser menu.';

        narrator.cue(message);
        alert(message);

        console.error('PWA installation error:', error);

    } finally {
        _deferredInstallPrompt = null;
        hideInstallBanner();
    }

});

function hideInstallBanner(){const b=document.getElementById('pwa-install-banner');if(b)b.remove();}
startReminderEngine();
const saved=await loadActiveWorkout();
if(saved&&STATE.profile?.onboardingDone)STATE.modal={type:'resume',saved};
render();
// Bind FAB
document.getElementById('a11y-fab').addEventListener('click',()=>{
unlockVoice();
if(STATE.workout){const b=currentBlock();if(b)narrator.cue(`Aktuell: ${b.name}. ${b.audioDesc||b.cue}. ${b.safety?'Sicherheit: '+b.safety:''}`);else narrator.cue('Training läuft.');return;}
const guide=VIEW_GUIDE[STATE.view]?.()||VIEW_DESC[STATE.view]?.()||'Kein Kontext.';
narrator.cue(guide);
});
}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div class="view"><h1>Fehler</h1><p>${e.message}</p><pre style="font-size:12px;white-space:pre-wrap">${e.stack||''}</pre></div>`;}
})();

document.addEventListener('click',unlockVoice,{once:true});
document.addEventListener('click',e=>{if(e.target.closest('button,.btn,.choice,.nav-item'))tapSound();},true);

/* ===== GUIDED TOUR ===== */
const GuidedTour={
steps:[
{sel:'.bottom-nav',text:'Navigation: Wechseln Sie zwischen den Bereichen der App. Jeder Tab hat eine eigene Funktion.',pos:'top'},
{sel:'.btn.big',text:'Start-Button: Hiermit beginnen Sie Ihr Training. Ein Sicherheitscheck wird vorgeschaltet.',pos:'top'},
{sel:'.a11y-fab',text:'Vorlese-Button: Tippen Sie hier, um sich den aktuellen Bildschirm vorlesen zu lassen.',pos:'bottom'},
{sel:'.bottom-nav .nav-item:last-child',text:'Hilfe-Bereich: Hier finden Sie die Anleitung, Einstellungen und wissenschaftliche Hintergründe.',pos:'top'}
],
_idx:0,_overlay:null,
start(){if(!this.steps.length)return;this._idx=0;this._show();},
_show(){this._remove();if(this._idx>=this.steps.length){this._finish();return;}
const step=this.steps[this._idx];const el=document.querySelector(step.sel);
const ov=document.createElement('div');ov.className='tour-overlay';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Geführte Tour');
const card=document.createElement('div');card.className='tour-card';
if(el){const r=el.getBoundingClientRect();const spot=document.createElement('div');spot.className='tour-spot';spot.style.cssText=`top:${r.top-6}px;left:${r.left-6}px;width:${r.width+12}px;height:${r.height+12}px`;ov.appendChild(spot);
card.style.top=step.pos==='top'?`${Math.max(10,r.top-180)}px`:`${r.bottom+16}px`;}
card.innerHTML=`<p style="margin-bottom:14px;line-height:1.5">${step.text}</p><p style="font-size:14px;color:#475569;margin-bottom:14px">Schritt ${this._idx+1} von ${this.steps.length}</p>`;
const bRow=document.createElement('div');bRow.style.cssText='display:flex;gap:10px';
const bSpeak=document.createElement('button');bSpeak.className='btn secondary';bSpeak.style.cssText='min-height:64px;flex:1';bSpeak.textContent='🔊 Vorlesen';bSpeak.onclick=()=>narrator.cue(step.text);
const bNext=document.createElement('button');bNext.className='btn';bNext.style.cssText='min-height:64px;flex:1';bNext.textContent=this._idx<this.steps.length-1?'Weiter ➜':'Fertig ✓';bNext.onclick=()=>{this._idx++;this._show();};
const bSkip=document.createElement('button');bSkip.className='btn ghost';bSkip.style.cssText='min-height:52px;flex:1';bSkip.textContent='Überspringen';bSkip.onclick=()=>this._finish();
bRow.appendChild(bSpeak);bRow.appendChild(bNext);card.appendChild(bRow);
if(this._idx<this.steps.length-1){const bRow2=document.createElement('div');bRow2.style.cssText='margin-top:8px';bRow2.appendChild(bSkip);card.appendChild(bRow2);}
ov.appendChild(card);document.body.appendChild(ov);this._overlay=ov;narrator.cue(step.text);bNext.focus();},
_remove(){if(this._overlay){this._overlay.remove();this._overlay=null;}},
_finish(){this._remove();if(STATE.profile){STATE.profile.a11y.tourCompleted=true;saveProfile();}narrator.announce('Tour abgeschlossen.');}
};
</script>
